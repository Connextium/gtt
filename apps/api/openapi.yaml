openapi: 3.1.0
info:
  title: Global Trade Treasury API
  version: 0.1.0-full-api-foundation
  description: API-centric Global Trade Treasury backend covering operations, Circle integration, events, webhooks, and release readiness.
servers:
  - url: http://localhost:4000
security:
  - ApiKeyBearer: []
  - ApiKeyHeader: []
components:
  securitySchemes:
    ApiKeyBearer:
      type: http
      scheme: bearer
      description: Use `Authorization: Bearer gtt_live_<key_id>.<secret>`.
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-GTT-API-Key
      description: Use `X-GTT-API-Key: gtt_live_<key_id>.<secret>`.
    BusinessUserBearer:
      type: http
      scheme: bearer
      description: Use first-party business-user JWT bearer token issued by `/business/auth/sign-in`.
  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        detail:
          type: string
      example:
        error: "business_user_auth_required"
        detail: "Missing or invalid bearer token."
    MoneyMinorUnits:
      type: string
      pattern: "^[0-9]+$"
    BusinessAuthSignInRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      example:
        email: "ops@acme-trading.com"
        password: "S3curePass!2026"
    BusinessAuthSetPasswordRequest:
      type: object
      required:
        - password
      properties:
        token:
          type: string
          description: Optional invitation token. If omitted, bearer token from Authorization can be used.
        password:
          type: string
      example:
        token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.invitation.sample"
        password: "N3wStrongerPass!2026"
    BusinessAuthResetPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
      example:
        email: "ops@acme-trading.com"
    BusinessAuthRefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
      example:
        refreshToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.refresh.sample"
    BusinessJwtUser:
      type: object
      required:
        - id
      properties:
        id:
          type: string
        email:
          type: string
          format: email
      example:
        id: "9f7b9f57-0af0-4f1a-b1eb-31c7ec9f2c83"
        email: "ops@acme-trading.com"
    BusinessJwtSession:
      type: object
      required:
        - access_token
        - token_type
        - user
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: bearer
        expires_in:
          type: integer
        expires_at:
          type: integer
        refresh_token:
          type: string
        user:
          $ref: "#/components/schemas/BusinessJwtUser"
      example:
        access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.access.sample"
        token_type: "bearer"
        expires_in: 3600
        expires_at: 1788868800
        refresh_token: "refresh_token_sample"
        user:
          id: "9f7b9f57-0af0-4f1a-b1eb-31c7ec9f2c83"
          email: "ops@acme-trading.com"
    BusinessAuthSessionResponse:
      type: object
      required:
        - session
      properties:
        session:
          $ref: "#/components/schemas/BusinessJwtSession"
      example:
        session:
          access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.access.sample"
          token_type: "bearer"
          expires_in: 3600
          refresh_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.refresh.sample"
          user:
            id: "9f7b9f57-0af0-4f1a-b1eb-31c7ec9f2c83"
            email: "ops@acme-trading.com"
    BusinessAuthMeResponse:
      type: object
      required:
        - user
      properties:
        user:
          type: object
          required:
            - authUserId
            - email
          properties:
            authUserId:
              type: string
            email:
              type: string
              format: email
      example:
        user:
          authUserId: "9f7b9f57-0af0-4f1a-b1eb-31c7ec9f2c83"
          email: "ops@acme-trading.com"
    BusinessAuthResetPasswordResponse:
      type: object
      required:
        - ok
        - status
        - message
      properties:
        ok:
          type: boolean
        status:
          type: string
          enum:
            - password_reset_sent
        message:
          type: string
      example:
        ok: true
        status: "password_reset_sent"
        message: "Password reset email sent."
    BusinessAdaBalances:
      type: object
      required:
        - availableMinorUnits
        - pendingMinorUnits
        - reservedMinorUnits
        - lockedMinorUnits
        - suspenseMinorUnits
      properties:
        availableMinorUnits:
          type: string
          pattern: "^[0-9]+$"
        pendingMinorUnits:
          type: string
          pattern: "^[0-9]+$"
        reservedMinorUnits:
          type: string
          pattern: "^[0-9]+$"
        lockedMinorUnits:
          type: string
          pattern: "^[0-9]+$"
        suspenseMinorUnits:
          type: string
          pattern: "^[0-9]+$"
        updatedAt:
          type: string
          format: date-time
      example:
        availableMinorUnits: "2500000"
        pendingMinorUnits: "0"
        reservedMinorUnits: "0"
        lockedMinorUnits: "0"
        suspenseMinorUnits: "0"
        updatedAt: "2026-09-08T12:00:00.000Z"
    BusinessAdaAccount:
      type: object
      required:
        - id
        - accountName
        - businessClientId
        - status
        - usePurpose
      properties:
        id:
          type: string
        accountCode:
          type: string
        accountName:
          type: string
        businessClientId:
          type: string
        businessClientName:
          type: string
        status:
          type: string
        usePurpose:
          type: string
        assetCode:
          type: string
        assetRail:
          type: string
        activationDecision:
          type: string
          enum:
            - auto
            - approval_required
        activationReasonCode:
          type: string
        createdAt:
          type: string
          format: date-time
        balances:
          $ref: "#/components/schemas/BusinessAdaBalances"
      example:
        id: "ada_01J6T8H1MZ4JQ9A5QYDR2E7T60"
        accountCode: "DAA-USDC-GEN-TRES"
        accountName: "Treasury Ops"
        businessClientId: "bc_01J6T8BCRX9KP0Q2WJ9GT5B2TQ"
        businessClientName: "Acme Trading LLC"
        status: "active"
        usePurpose: "general"
        assetCode: "USDC"
        assetRail: "circle_wallet"
        activationDecision: "auto"
        activationReasonCode: "virtual_no_linked_instrument_auto_activation"
        createdAt: "2026-09-08T11:42:12.000Z"
        balances:
          availableMinorUnits: "2500000"
          pendingMinorUnits: "0"
          reservedMinorUnits: "0"
          lockedMinorUnits: "0"
          suspenseMinorUnits: "0"
    BusinessAdaAccountListResponse:
      type: object
      required:
        - accounts
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/BusinessAdaAccount"
      example:
        accounts:
          - id: "ada_01J6T8H1MZ4JQ9A5QYDR2E7T60"
            accountCode: "DAA-USDC-GEN-TRES"
            accountName: "Treasury Ops"
            businessClientId: "bc_01J6T8BCRX9KP0Q2WJ9GT5B2TQ"
            status: "active"
            usePurpose: "general"
            assetCode: "USDC"
            activationDecision: "auto"
            activationReasonCode: "virtual_no_linked_instrument_auto_activation"
    BusinessAdaAccountResponse:
      type: object
      required:
        - account
      properties:
        account:
          $ref: "#/components/schemas/BusinessAdaAccount"
      example:
        account:
          id: "ada_01J6T8H1MZ4JQ9A5QYDR2E7T60"
          accountCode: "DAA-USDC-GEN-TRES"
          accountName: "Treasury Ops"
          businessClientId: "bc_01J6T8BCRX9KP0Q2WJ9GT5B2TQ"
          status: "active"
          usePurpose: "general"
          assetCode: "USDC"
    BusinessApiKey:
      type: object
      required:
        - id
        - keyPrefix
        - ownerBusinessClientId
        - ownerBusinessClientName
        - scopes
        - status
        - createdAt
      properties:
        id:
          type: string
        keyPrefix:
          type: string
        ownerAuthUserId:
          type: string
        ownerTenantId:
          type: string
        ownerBusinessClientId:
          type: string
        ownerBusinessClientName:
          type: string
        scopes:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
            - active
            - revoked
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
      example:
        id: "2f3c17d4-2b41-4cf1-aab4-d68263cc8ccd"
        keyPrefix: "gtt_live_8a1df4e0"
        ownerBusinessClientId: "bc_01J6T8BCRX9KP0Q2WJ9GT5B2TQ"
        ownerBusinessClientName: "Acme Trading LLC"
        scopes:
          - "ada.read"
          - "payment-instruction.create"
        status: "active"
        createdAt: "2026-09-08T11:52:05.000Z"
    BusinessApiKeyListResponse:
      type: object
      required:
        - keys
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/BusinessApiKey"
      example:
        keys:
          - id: "2f3c17d4-2b41-4cf1-aab4-d68263cc8ccd"
            keyPrefix: "gtt_live_8a1df4e0"
            ownerBusinessClientId: "bc_01J6T8BCRX9KP0Q2WJ9GT5B2TQ"
            ownerBusinessClientName: "Acme Trading LLC"
            scopes:
              - "ada.read"
            status: "active"
            createdAt: "2026-09-08T11:52:05.000Z"
    BusinessApiKeyResponse:
      type: object
      required:
        - key
      properties:
        key:
          $ref: "#/components/schemas/BusinessApiKey"
      example:
        key:
          id: "2f3c17d4-2b41-4cf1-aab4-d68263cc8ccd"
          keyPrefix: "gtt_live_8a1df4e0"
          ownerBusinessClientId: "bc_01J6T8BCRX9KP0Q2WJ9GT5B2TQ"
          ownerBusinessClientName: "Acme Trading LLC"
          scopes:
            - "ada.read"
          status: "revoked"
          createdAt: "2026-09-08T11:52:05.000Z"
          revokedAt: "2026-09-08T12:15:00.000Z"
    BusinessApiKeyWithPlaintextResponse:
      type: object
      required:
        - key
        - plaintextKey
      properties:
        key:
          $ref: "#/components/schemas/BusinessApiKey"
        plaintextKey:
          type: string
      example:
        key:
          id: "2f3c17d4-2b41-4cf1-aab4-d68263cc8ccd"
          keyPrefix: "gtt_live_8a1df4e0"
          ownerBusinessClientId: "bc_01J6T8BCRX9KP0Q2WJ9GT5B2TQ"
          ownerBusinessClientName: "Acme Trading LLC"
          scopes:
            - "ada.read"
            - "payment-instruction.create"
          status: "active"
          createdAt: "2026-09-08T11:52:05.000Z"
        plaintextKey: "gtt_live_8a1df4e0.7c6f0b3f0f524d3ab8b7f0f4a2ce0921"
    BusinessApiKeyRotateResponse:
      type: object
      required:
        - key
        - plaintextKey
        - rotatedFromApiKeyId
      properties:
        key:
          $ref: "#/components/schemas/BusinessApiKey"
        plaintextKey:
          type: string
        rotatedFromApiKeyId:
          type: string
      example:
        key:
          id: "5e5296d8-55e6-4f5a-bb02-f1f1c7e508a1"
          keyPrefix: "gtt_live_1726fd3b"
          ownerBusinessClientId: "bc_01J6T8BCRX9KP0Q2WJ9GT5B2TQ"
          ownerBusinessClientName: "Acme Trading LLC"
          scopes:
            - "ada.read"
            - "payment-instruction.create"
          status: "active"
          createdAt: "2026-09-08T12:20:12.000Z"
        plaintextKey: "gtt_live_1726fd3b.b72a9e68de4f4e77b8ecb1af53dc8af2"
        rotatedFromApiKeyId: "2f3c17d4-2b41-4cf1-aab4-d68263cc8ccd"
    BusinessFundingInstruction:
      type: object
      required:
        - id
        - sourceAccountOfDigitalAssetId
        - sourceAdaCode
        - sourceAccountCode
        - destinationAccountOfDigitalAssetId
        - destinationAdaCode
        - destinationAccountCode
        - fundingType
        - instructionRole
        - transferKind
        - assetCode
        - currency
        - amountMinorUnits
        - pendingUsdcMinorUnits
        - availableUsdcMinorUnits
        - status
      properties:
        id:
          type: string
        sourceAccountOfDigitalAssetId:
          type: string
        sourceAdaCode:
          type: string
        sourceAccountCode:
          type: string
        destinationAccountOfDigitalAssetId:
          type: string
        destinationAdaCode:
          type: string
        destinationAccountCode:
          type: string
        fundingType:
          type: string
        instructionRole:
          type: string
        transferKind:
          type: string
        assetCode:
          type: string
        currency:
          type: string
        amountMinorUnits:
          type: string
          pattern: "^[0-9]+$"
        pendingUsdcMinorUnits:
          type: string
          pattern: "^[0-9]+$"
        availableUsdcMinorUnits:
          type: string
          pattern: "^[0-9]+$"
        status:
          type: string
        supportReference:
          type: string
        postingJournalEntryId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        id: "fe2f1f74-8de8-4f89-b094-c7ca41b22875"
        sourceAccountOfDigitalAssetId: "66c3df29-a9ed-45aa-b9af-cd9940f6f314"
        sourceAdaCode: "DAA-USDC-OPS-SOUR"
        sourceAccountCode: "DAA-USDC-OPS-SOUR"
        destinationAccountOfDigitalAssetId: "2f64d70f-fcbd-4ec6-8eb5-06fae53cb5ef"
        destinationAdaCode: "DAA-USDC-LIQ-DEST"
        destinationAccountCode: "DAA-USDC-LIQ-DEST"
        fundingType: "usdc_payin"
        instructionRole: "client_exchange"
        transferKind: "ada_to_ada_payin_underlying"
        assetCode: "USDC"
        currency: "USD"
        amountMinorUnits: "1250000"
        pendingUsdcMinorUnits: "0"
        availableUsdcMinorUnits: "1250000"
        status: "completed"
        createdAt: "2026-09-08T12:30:10.000Z"
        updatedAt: "2026-09-08T12:31:02.000Z"
    BusinessFundingInstructionOrder:
      type: object
      required:
        - id
        - orderKind
        - stage
        - amountMinorUnits
        - currency
        - status
      properties:
        id:
          type: string
        orderKind:
          type: string
        stage:
          type: string
        dependencyOrderId:
          type: string
        amountMinorUnits:
          type: string
          pattern: "^[0-9]+$"
        currency:
          type: string
        status:
          type: string
        completedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        id: "8c900f31-4dd8-47c7-9950-95cff5ce8194"
        orderKind: "ada_wire_transfer"
        stage: "fiat_received"
        amountMinorUnits: "1250000"
        currency: "USD"
        status: "completed"
        createdAt: "2026-09-08T12:30:10.000Z"
        updatedAt: "2026-09-08T12:31:02.000Z"
    BusinessFundingInstructionListResponse:
      type: object
      required:
        - fundingInstructions
      properties:
        fundingInstructions:
          type: array
          items:
            $ref: "#/components/schemas/BusinessFundingInstruction"
      example:
        fundingInstructions:
          - id: "fe2f1f74-8de8-4f89-b094-c7ca41b22875"
            sourceAccountOfDigitalAssetId: "66c3df29-a9ed-45aa-b9af-cd9940f6f314"
            sourceAdaCode: "DAA-USDC-OPS-SOUR"
            sourceAccountCode: "DAA-USDC-OPS-SOUR"
            destinationAccountOfDigitalAssetId: "2f64d70f-fcbd-4ec6-8eb5-06fae53cb5ef"
            destinationAdaCode: "DAA-USDC-LIQ-DEST"
            destinationAccountCode: "DAA-USDC-LIQ-DEST"
            fundingType: "usdc_payin"
            instructionRole: "client_exchange"
            transferKind: "ada_to_ada_payin_underlying"
            assetCode: "USDC"
            currency: "USD"
            amountMinorUnits: "1250000"
            pendingUsdcMinorUnits: "0"
            availableUsdcMinorUnits: "1250000"
            status: "completed"
    BusinessFundingInstructionDetailResponse:
      type: object
      required:
        - fundingInstruction
        - orders
      properties:
        fundingInstruction:
          $ref: "#/components/schemas/BusinessFundingInstruction"
        orders:
          type: array
          items:
            $ref: "#/components/schemas/BusinessFundingInstructionOrder"
      example:
        fundingInstruction:
          id: "fe2f1f74-8de8-4f89-b094-c7ca41b22875"
          sourceAccountOfDigitalAssetId: "66c3df29-a9ed-45aa-b9af-cd9940f6f314"
          sourceAdaCode: "DAA-USDC-OPS-SOUR"
          sourceAccountCode: "DAA-USDC-OPS-SOUR"
          destinationAccountOfDigitalAssetId: "2f64d70f-fcbd-4ec6-8eb5-06fae53cb5ef"
          destinationAdaCode: "DAA-USDC-LIQ-DEST"
          destinationAccountCode: "DAA-USDC-LIQ-DEST"
          fundingType: "usdc_payin"
          instructionRole: "client_exchange"
          transferKind: "ada_to_ada_payin_underlying"
          assetCode: "USDC"
          currency: "USD"
          amountMinorUnits: "1250000"
          pendingUsdcMinorUnits: "0"
          availableUsdcMinorUnits: "1250000"
          status: "completed"
        orders:
          - id: "8c900f31-4dd8-47c7-9950-95cff5ce8194"
            orderKind: "ada_wire_transfer"
            stage: "fiat_received"
            amountMinorUnits: "1250000"
            currency: "USD"
            status: "completed"
    BusinessFundingInstructionOrdersResponse:
      type: object
      required:
        - fundingInstructionId
        - orders
      properties:
        fundingInstructionId:
          type: string
        orders:
          type: array
          items:
            $ref: "#/components/schemas/BusinessFundingInstructionOrder"
      example:
        fundingInstructionId: "fe2f1f74-8de8-4f89-b094-c7ca41b22875"
        orders:
          - id: "8c900f31-4dd8-47c7-9950-95cff5ce8194"
            orderKind: "ada_wire_transfer"
            stage: "fiat_received"
            amountMinorUnits: "1250000"
            currency: "USD"
            status: "completed"
    BasicOkResponse:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
      example:
        ok: true
paths:
  /health:
    get:
      security: []
      responses:
        "200":
          description: Service health.
  /manifest:
    get:
      security: []
      responses:
        "200":
          description: API manifest and migration state.
  /readiness:
    get:
      security: []
      responses:
        "200":
          description: Runtime readiness, database configuration, state-store persistence status, and Circle mode.
  /auth/invitations:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Accept email-only self-registration and dispatch Supabase Auth invitation.
  /business/auth/sign-in:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessAuthSignInRequest"
      responses:
        "200":
          description: Authenticate business user via Supabase and return first-party JWT bearer session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessAuthSessionResponse"
              examples:
                success:
                  value:
                    session:
                      access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.access.sample"
                      token_type: "bearer"
                      expires_in: 3600
                      user:
                        id: "9f7b9f57-0af0-4f1a-b1eb-31c7ec9f2c83"
                        email: "ops@acme-trading.com"
        "401":
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalid_credentials:
                  value:
                    error: "invalid_credentials"
                    detail: "Email or password is incorrect."
        "503":
          description: Business auth is not fully configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                supabase_admin_not_configured:
                  value:
                    error: "supabase_admin_not_configured"
                    detail: "SUPABASE_SERVICE_ROLE_KEY is not configured."
                business_auth_not_configured:
                  value:
                    error: "business_auth_not_configured"
                    detail: "BUSINESS_AUTH_JWT_SECRET is not configured."
  /business/auth/set-password:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessAuthSetPasswordRequest"
      responses:
        "200":
          description: Set password and return first-party JWT bearer session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessAuthSessionResponse"
              examples:
                success:
                  value:
                    session:
                      access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.access.sample"
                      token_type: "bearer"
                      expires_in: 3600
                      user:
                        id: "9f7b9f57-0af0-4f1a-b1eb-31c7ec9f2c83"
                        email: "ops@acme-trading.com"
        "401":
          description: Missing or invalid invitation/session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                business_user_auth_required:
                  value:
                    error: "business_user_auth_required"
                    detail: "Missing or invalid bearer token."
        "503":
          description: Business auth is not fully configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                supabase_admin_not_configured:
                  value:
                    error: "supabase_admin_not_configured"
                    detail: "SUPABASE_SERVICE_ROLE_KEY is not configured."
                business_auth_not_configured:
                  value:
                    error: "business_auth_not_configured"
                    detail: "BUSINESS_AUTH_JWT_SECRET is not configured."
  /business/auth/reset-password:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessAuthResetPasswordRequest"
      responses:
        "200":
          description: Password reset email requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessAuthResetPasswordResponse"
              examples:
